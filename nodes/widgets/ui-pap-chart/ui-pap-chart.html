<script type="text/javascript">
    RED.nodes.registerType('ui-pap-chart', {
        category: 'PAP Dashboard',
        color: '#34a4ff',
        defaults: {
            name:        { value: 'Chart' },
            subgroup:    { value: '', type: 'ui-pap-subgroup', required: true },
            order:       { value: 0 },
            icon:        { value: 'line-chart' },
            accentColor: { value: 'blue' },
            unit:        { value: '' },
            decimals:    { value: 1 },
            maxPoints:   { value: 60 },
            driverLabel: { value: '' },
            gridW:       { value: 2 },
            gridH:       { value: 1 }
        },
        inputs:  1,
        outputs: 0,
        icon: 'font-awesome/fa-line-chart',
        label: function () { return this.name || 'Chart' },
        paletteLabel: 'chart'
    })
</script>

<script type="text/html" data-template-name="ui-pap-chart">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="e.g. Temperatura esterna">
    </div>
    <div class="form-row">
        <label for="node-input-subgroup"><i class="fa fa-th-large"></i> Subgroup</label>
        <input type="text" id="node-input-subgroup">
    </div>
    <div class="form-row">
        <label for="node-input-order"><i class="fa fa-sort"></i> Order</label>
        <input type="number" id="node-input-order" style="width:80px;" placeholder="0">
    </div>
    <div class="form-row">
        <label for="node-input-driverLabel"><i class="fa fa-microchip"></i> Driver</label>
        <input type="text" id="node-input-driverLabel" placeholder="optional">
    </div>
    <div class="form-row">
        <label for="node-input-icon"><i class="fa fa-image"></i> Icon</label>
        <input type="text" id="node-input-icon" placeholder="line-chart">
    </div>
    <div class="form-row">
        <label for="node-input-unit"><i class="fa fa-superscript"></i> Unit</label>
        <input type="text" id="node-input-unit" placeholder="e.g. °C, %, W">
    </div>
    <div class="form-row">
        <label for="node-input-decimals"><i class="fa fa-calculator"></i> Decimals</label>
        <input type="number" id="node-input-decimals" style="width:70px;" placeholder="1">
    </div>
    <div class="form-row">
        <label for="node-input-maxPoints"><i class="fa fa-history"></i> History points</label>
        <input type="number" id="node-input-maxPoints" style="width:80px;" placeholder="60">
        <span style="margin-left:8px; font-size:0.85em; color:#888;">quanti campioni mantenere</span>
    </div>
    <div class="form-row">
        <label for="node-input-accentColor"><i class="fa fa-paint-brush"></i> Accent</label>
        <select id="node-input-accentColor">
            <option value="yellow">Yellow</option>
            <option value="orange">Orange</option>
            <option value="purple">Purple</option>
            <option value="blue">Blue</option>
            <option value="green">Green</option>
        </select>
    </div>
    <div class="form-row">
        <label><i class="fa fa-th"></i> Grid size</label>
        <input type="number" id="node-input-gridW" min="1" max="12" style="width:50px;" placeholder="2">
        <span style="margin: 0 6px;">×</span>
        <input type="number" id="node-input-gridH" min="1" max="12" style="width:50px;" placeholder="1">
        <span style="margin-left:8px; font-size:0.85em; color:#888;">colonne × righe</span>
    </div>
</script>

<script type="text/html" data-help-name="ui-pap-chart">
    <p>Time-series line chart widget. No output — pure display.</p>
    <p><b>Input:</b> <code>msg.payload</code> — a number or <code>{ value: number }</code>.
       Each input appends one point to a rolling history (capped at "History points"), shown as
       a mini line chart with the latest value and a min/max readout for the visible window.</p>
    <p>History is persisted via Node-RED context together with the rest of the dashboard state
       (survives restarts if <code>contextStorage</code> is file-backed in <code>settings.js</code>).</p>
</script>
