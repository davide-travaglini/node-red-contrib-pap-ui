<script type="text/javascript">
    RED.nodes.registerType('ui-pap-clock', {
        category: 'PAP Dashboard',
        color: '#c792ea',
        defaults: {
            name:        { value: 'Clock' },
            subgroup:    { value: '', type: 'ui-pap-subgroup', required: true },
            order:       { value: 0 },
            icon:        { value: 'clock-o' },
            accentColor: { value: 'purple' },
            timezone:    { value: '' },
            showDate:    { value: true },
            hour12:      { value: false },
            driverLabel: { value: '' },
            gridW:       { value: 1 },
            gridH:       { value: 1 }
        },
        inputs:  1,
        outputs: 0,
        icon: 'font-awesome/fa-clock-o',
        label: function () { return this.name || 'Clock' },
        paletteLabel: 'clock'
    })
</script>

<script type="text/html" data-template-name="ui-pap-clock">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="e.g. Locale, UTC, New York">
    </div>
    <div class="form-row">
        <label for="node-input-subgroup"><i class="fa fa-th-large"></i> Subgroup</label>
        <input type="text" id="node-input-subgroup">
    </div>
    <div class="form-row">
        <label for="node-input-order"><i class="fa fa-sort"></i> Order</label>
        <input type="number" id="node-input-order" style="width:80px;" placeholder="0">
    </div>
    <div class="form-row">
        <label for="node-input-driverLabel"><i class="fa fa-microchip"></i> Driver</label>
        <input type="text" id="node-input-driverLabel" placeholder="optional">
    </div>
    <div class="form-row">
        <label for="node-input-timezone"><i class="fa fa-globe"></i> Timezone</label>
        <input type="text" id="node-input-timezone" placeholder="es. Europe/Rome, UTC, America/New_York — vuoto = fuso del browser">
    </div>
    <div class="form-row">
        <label for="node-input-showDate"><i class="fa fa-calendar"></i> Show date</label>
        <input type="checkbox" id="node-input-showDate" style="width:auto; margin-left:4px;">
    </div>
    <div class="form-row">
        <label for="node-input-hour12"><i class="fa fa-clock-o"></i> 12h format</label>
        <input type="checkbox" id="node-input-hour12" style="width:auto; margin-left:4px;">
    </div>
    <div class="form-row">
        <label for="node-input-accentColor"><i class="fa fa-paint-brush"></i> Accent</label>
        <select id="node-input-accentColor">
            <option value="yellow">Yellow</option>
            <option value="orange">Orange</option>
            <option value="purple">Purple</option>
            <option value="blue">Blue</option>
            <option value="green">Green</option>
        </select>
    </div>
    <div class="form-row">
        <label><i class="fa fa-th"></i> Grid size</label>
        <input type="number" id="node-input-gridW" min="1" max="12" style="width:50px;" placeholder="1">
        <span style="margin: 0 6px;">×</span>
        <input type="number" id="node-input-gridH" min="1" max="12" style="width:50px;" placeholder="1">
        <span style="margin-left:8px; font-size:0.85em; color:#888;">colonne × righe</span>
    </div>
</script>

<script type="text/html" data-help-name="ui-pap-clock">
    <p>Purely client-side digital clock tile — no input required, ticks every second in the
       browser using <code>Intl.DateTimeFormat</code>. Add one tile per timezone you care about
       (e.g. "Locale" = Europe/Rome, "UTC", "New York" = America/New_York) to build a simple
       world-clock row on the dashboard.</p>
</script>
