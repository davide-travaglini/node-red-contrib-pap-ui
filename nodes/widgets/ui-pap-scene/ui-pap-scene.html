<script type="text/javascript">
    RED.nodes.registerType('ui-pap-scene', {
        category: 'PAP Dashboard',
        color: '#c792ea',
        defaults: {
            name:        { value: 'Scene' },
            subgroup:    { value: '', type: 'ui-pap-subgroup', required: true },
            order:       { value: 0 },
            icon:        { value: 'bolt' },
            accentColor: { value: 'purple' },
            driverLabel: { value: '' },
            gridW:       { value: 1 },
            gridH:       { value: 1 }
        },
        inputs:  1,
        outputs: 1,
        icon: 'font-awesome/fa-bolt',
        label: function () { return this.name || 'Scene' },
        paletteLabel: 'scene'
    })
</script>

<script type="text/html" data-template-name="ui-pap-scene">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="e.g. Good night">
    </div>
    <div class="form-row">
        <label for="node-input-subgroup"><i class="fa fa-th-large"></i> Subgroup</label>
        <input type="text" id="node-input-subgroup">
    </div>
    <div class="form-row">
        <label for="node-input-order"><i class="fa fa-sort"></i> Order</label>
        <input type="number" id="node-input-order" style="width:80px;" placeholder="0">
    </div>
    <div class="form-row">
        <label for="node-input-driverLabel"><i class="fa fa-microchip"></i> Driver</label>
        <input type="text" id="node-input-driverLabel" placeholder="optional">
    </div>
    <div class="form-row">
        <label for="node-input-icon"><i class="fa fa-image"></i> Icon</label>
        <input type="text" id="node-input-icon" placeholder="e.g. bolt, moon-o, sun-o">
    </div>
    <div class="form-row">
        <label for="node-input-accentColor"><i class="fa fa-paint-brush"></i> Accent</label>
        <select id="node-input-accentColor">
            <option value="yellow">Yellow</option>
            <option value="orange">Orange</option>
            <option value="purple">Purple</option>
            <option value="blue">Blue</option>
            <option value="green">Green</option>
        </select>
    </div>
    <div class="form-row">
        <label><i class="fa fa-th"></i> Grid size</label>
        <input type="number" id="node-input-gridW" min="1" max="12" style="width:50px;" placeholder="1">
        <span style="margin: 0 6px;">×</span>
        <input type="number" id="node-input-gridH" min="1" max="12" style="width:50px;" placeholder="1">
        <span style="margin-left:8px; font-size:0.85em; color:#888;">colonne × righe</span>
    </div>
</script>

<script type="text/html" data-help-name="ui-pap-scene">
    <p>Scene activation tile. No input state — every tap emits
       <code>msg.payload = true</code> with <code>msg.topic</code> set to the scene name, so a
       downstream flow can run the matching sequence of actions.</p>
</script>
