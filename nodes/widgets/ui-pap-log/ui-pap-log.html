<script type="text/javascript">
    RED.nodes.registerType('ui-pap-log', {
        category: 'PAP Dashboard',
        color: '#9aa0a6',
        defaults: {
            name:        { value: 'Activity Log' },
            subgroup:    { value: '', type: 'ui-pap-subgroup', required: true },
            order:       { value: 0 },
            icon:        { value: 'list' },
            maxEntries:  { value: 10 },
            driverLabel: { value: '' },
            gridW:       { value: 2 },
            gridH:       { value: 2 }
        },
        inputs:  1,
        outputs: 0,
        icon: 'font-awesome/fa-list',
        label: function () { return this.name || 'Activity Log' },
        paletteLabel: 'log'
    })
</script>

<script type="text/html" data-template-name="ui-pap-log">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Activity Log">
    </div>
    <div class="form-row">
        <label for="node-input-subgroup"><i class="fa fa-th-large"></i> Subgroup</label>
        <input type="text" id="node-input-subgroup">
    </div>
    <div class="form-row">
        <label for="node-input-order"><i class="fa fa-sort"></i> Order</label>
        <input type="number" id="node-input-order" style="width:80px;" placeholder="0">
    </div>
    <div class="form-row">
        <label for="node-input-maxEntries"><i class="fa fa-list-ol"></i> Entries shown</label>
        <input type="number" id="node-input-maxEntries" style="width:80px;" placeholder="10">
    </div>
    <div class="form-row">
        <label><i class="fa fa-th"></i> Grid size</label>
        <input type="number" id="node-input-gridW" min="1" max="12" style="width:50px;" placeholder="2">
        <span style="margin: 0 6px;">×</span>
        <input type="number" id="node-input-gridH" min="1" max="12" style="width:50px;" placeholder="2">
    </div>
    <div class="form-tips">
        Shows the most recent user actions across <b>all</b> dashboard widgets (not just this
        subgroup) — who clicked what, and when. One instance anywhere on the dashboard is enough.
    </div>
</script>

<script type="text/html" data-help-name="ui-pap-log">
    <p>Global activity feed — the last N user actions sent from the dashboard (any widget),
       with timestamp and widget label. No input/output in the usual sense; it's a pure
       read-only view of the server's action log.</p>
</script>
