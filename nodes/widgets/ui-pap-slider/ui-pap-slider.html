<script type="text/javascript">
    RED.nodes.registerType('ui-pap-slider', {
        category: 'PAP Dashboard',
        color: '#34a4ff',
        defaults: {
            name:        { value: 'Slider' },
            subgroup:    { value: '', type: 'ui-pap-subgroup', required: true },
            order:       { value: 0 },
            icon:        { value: 'sliders' },
            accentColor: { value: 'blue' },
            readOnly:    { value: false },
            unit:        { value: '' },
            min:         { value: 0 },
            max:         { value: 100 },
            step:        { value: 1 },
            decimals:    { value: 0 },
            driverLabel: { value: '' },
            gridW:       { value: 2 },
            gridH:       { value: 1 }
        },
        inputs:  1,
        outputs: 1,
        icon: 'font-awesome/fa-sliders',
        label: function () { return this.name || 'Slider' },
        paletteLabel: 'slider'
    })
</script>

<script type="text/html" data-template-name="ui-pap-slider">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="e.g. Dimmer">
    </div>
    <div class="form-row">
        <label for="node-input-subgroup"><i class="fa fa-th-large"></i> Subgroup</label>
        <input type="text" id="node-input-subgroup">
    </div>
    <div class="form-row">
        <label for="node-input-order"><i class="fa fa-sort"></i> Order</label>
        <input type="number" id="node-input-order" style="width:80px;" placeholder="0">
    </div>
    <div class="form-row">
        <label for="node-input-driverLabel"><i class="fa fa-microchip"></i> Driver</label>
        <input type="text" id="node-input-driverLabel" placeholder="e.g. DIMMER CH1">
    </div>
    <div class="form-row">
        <label for="node-input-icon"><i class="fa fa-image"></i> Icon</label>
        <input type="text" id="node-input-icon" placeholder="e.g. sliders, lightbulb-o, volume-up">
    </div>
    <div class="form-row">
        <label for="node-input-unit"><i class="fa fa-superscript"></i> Unit</label>
        <input type="text" id="node-input-unit" placeholder="e.g. %, dB">
    </div>
    <div class="form-row">
        <label for="node-input-readOnly"><i class="fa fa-lock"></i> Read only</label>
        <input type="checkbox" id="node-input-readOnly" style="width:auto; margin-left:4px;">
    </div>
    <div class="form-row">
        <label><i class="fa fa-arrows-h"></i> Min / Max</label>
        <input type="number" id="node-input-min" style="width:70px;" placeholder="0">
        <span style="margin: 0 6px;">to</span>
        <input type="number" id="node-input-max" style="width:70px;" placeholder="100">
    </div>
    <div class="form-row">
        <label><i class="fa fa-step-forward"></i> Step / Decimals</label>
        <input type="number" id="node-input-step" style="width:70px;" placeholder="1">
        <input type="number" id="node-input-decimals" style="width:70px; margin-left:8px;" placeholder="0">
    </div>
    <div class="form-row">
        <label for="node-input-accentColor"><i class="fa fa-paint-brush"></i> Accent</label>
        <select id="node-input-accentColor">
            <option value="yellow">Yellow</option>
            <option value="orange">Orange</option>
            <option value="purple">Purple</option>
            <option value="blue">Blue</option>
            <option value="green">Green</option>
        </select>
    </div>
    <div class="form-row">
        <label><i class="fa fa-th"></i> Grid size</label>
        <input type="number" id="node-input-gridW" min="1" max="12" style="width:50px;" placeholder="2">
        <span style="margin: 0 6px;">×</span>
        <input type="number" id="node-input-gridH" min="1" max="12" style="width:50px;" placeholder="1">
        <span style="margin-left:8px; font-size:0.85em; color:#888;">colonne × righe</span>
    </div>
</script>

<script type="text/html" data-help-name="ui-pap-slider">
    <p>Range slider widget. Input: a number or <code>{ value: number }</code> updates the fill.
       Output on drag release: <code>msg.payload = { value: number }</code> (unless Read only).</p>
</script>
